[project]
name = "my_first_bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3,<4",
    "chromadb>=1.5.9",
    "langsmith>=0.14.11",
    "openai",
    "pymupdf4llm==1.28.2",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_first_bot"]
